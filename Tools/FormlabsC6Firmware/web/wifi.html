<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>XH Multiscreen · Wi-Fi</title><style>/* PORTAL_STYLE */</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>XH Multiscreen</span></div><p class="model">Form Monitor<span>C6</span></p><nav aria-label="设置导航"><p class="nav-label">显示内容</p><a href="/standalone#preview">屏幕预览</a><a href="/standalone#printers">打印机</a><a href="/standalone#clock">翻页钟</a><a href="/standalone#weather">天气</a><p class="nav-label">设备</p><a href="/standalone">设备设置</a><a href="/standalone#sleep">自动休眠</a><a href="/standalone#firmware">固件更新</a><a href="/" aria-current="page">Wi-Fi 配网</a></nav></aside><main class="workspace">
<header class="page-heading"><div><p class="eyebrow">FORM MONITOR C6</p><h1>Wi-Fi 配网</h1><p>仅支持 2.4 GHz Wi-Fi，不支持 5 GHz 或 6 GHz。</p></div><div class="header-controls"><label class="appearance">网页外观<select id="appearance"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>显示语言<select id="pageLanguage"><option value="0">中文</option><option value="1">English</option></select></label></div></header>
<section class="card"><h2>连接状态</h2><p id="identity">正在读取设备信息…</p><a href="/standalone">设备设置</a></section>
<section class="card"><div class="card-heading"><h2>选择网络</h2><button id="scan" type="button">扫描附近 Wi-Fi</button></div><div id="networks" class="network-list"></div></section>
<section class="card"><form id="wifiForm" autocomplete="off"><div class="grid"><label class="field wide">Wi-Fi 名称（SSID）<input id="ssid" required maxlength="32" autocomplete="off" spellcheck="false"></label><label class="field wide">Wi-Fi 密码<input id="password" type="password" autocomplete="new-password"><small>开放网络可留空；密码不会回显，也不保存到浏览器。</small></label></div><div class="actions"><button id="connect" class="primary" type="submit">保存并连接</button><button id="refresh" type="button">检查连接状态</button></div></form><p id="status" class="status" role="status" aria-live="polite">选择网络或填写 SSID，然后保存。</p></section>
<footer class="footer">联网成功后，屏幕显示局域网 IP，配置热点自动关闭。请切回同一 Wi-Fi，再打开设备设置。</footer>
</main></div><script>'use strict';
/* PORTAL_I18N */
setupAppearance();applyLanguage();
const $=id=>document.getElementById(id),encoder=new TextEncoder();let busy=false,alive=true,pollTimer,statusSource='选择网络或填写 SSID，然后保存。';
function status(text){statusSource=text;$('status').textContent=t(text);}
function controls(){for(const id of ['scan','ssid','password','connect','refresh'])$(id).disabled=busy;}
async function request(path,options={}){const r=await fetch(path,{cache:'no-store',...options,signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error(uiEnglish?'Request failed ('+r.status+')':'请求失败（'+r.status+'）');return r;}
async function info(){try{const data=await request('/api/info').then(r=>r.json());if(!alive)return;uiEnglish=data.language===1;$('pageLanguage').value=uiEnglish?1:0;applyLanguage();status(statusSource);$('identity').textContent=(data.ip==='0.0.0.0'?t('等待联网'):data.ip)+' · '+data.fw;
if(/^192\.168\.\d{1,3}\.\d{1,3}$/.test(data.ip)||/^10\.\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(data.ip)||/^172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}$/.test(data.ip))for(const link of document.querySelectorAll('a[href^="/standalone"]'))link.href='http://'+data.ip+link.getAttribute('href');
}catch{status('连接超时，请检查设备网络。');}}
$('pageLanguage').onchange=()=>{uiEnglish=$('pageLanguage').value==='1';applyLanguage();status(statusSource);};
$('refresh').onclick=info;
$('scan').onclick=async()=>{if(busy)return;busy=true;controls();status('正在扫描附近的 2.4 GHz 网络…');try{let data=await request('/api/wifi/scan?start=1').then(r=>r.json());for(let i=0;data.busy&&i<24&&alive;i++){await new Promise(resolve=>setTimeout(resolve,500));data=await request('/api/wifi/scan').then(r=>r.json());}if(!alive)return;if(data.busy||data.error)throw Error(t('扫描失败，请稍后重试或手动填写 SSID。'));$('networks').replaceChildren();for(const network of data.networks||[]){if(!network.ssid)continue;const button=document.createElement('button');button.type='button';const name=document.createElement('span');name.textContent=network.ssid;const signal=document.createElement('small');signal.textContent=network.rssi+' dBm';button.append(name,signal);button.onclick=()=>{if($('ssid').value!==network.ssid)$('password').value='';$('ssid').value=network.ssid;$('password').focus();};$('networks').append(button);}status(data.networks?.length?'请选择网络并填写密码。':'没有发现网络，可手动填写 SSID。');}catch(e){if(alive)status(e.message);}finally{busy=false;if(alive)controls();}};
$('wifiForm').onsubmit=async event=>{event.preventDefault();if(busy)return;const ssid=$('ssid').value,password=$('password').value,n=encoder.encode(password).length;
if(!ssid||encoder.encode(ssid).length>32||ssid.includes('\0'))return status('SSID 必须为 1–32 个 UTF-8 字节。');
if(password.includes('\0')||!(n===0||(n>=8&&n<=63)||(n===64&&/^[0-9a-f]{64}$/i.test(password))))return status('密码应为 8–63 个字节，开放网络可留空。');
busy=true;controls();try{await request('/wifi',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({ssid,password}).toString()});$('password').value='';status('网络已保存。热点会关闭，请切回同一 Wi-Fi，打开屏幕上的 IP 地址。');pollTimer=setTimeout(info,3000);}catch(e){if(alive)status(e.message);}finally{busy=false;if(alive)controls();}};
$('ssid').oninput=()=>{$('password').value='';};window.addEventListener('pagehide',()=>{alive=false;$('password').value='';clearTimeout(pollTimer);});info();
</script></body></html>
